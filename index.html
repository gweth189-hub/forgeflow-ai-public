<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForgeFlow AI — Have a problem? Forge a solution.</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #080b14;
      color: #f5f7ff;
    }

    .app {
      min-height: 100vh;
      display: flex;
    }

    aside {
      width: 230px;
      padding: 28px 20px;
      border-right: 1px solid #202638;
      background: #0c101c;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 12px;
      color: #8d96ad;
      line-height: 1.5;
    }

    .nav {
      margin-top: 45px;
      color: #9da6bd;
      font-size: 14px;
    }

    .nav div {
      padding: 12px;
      border-radius: 9px;
      margin-bottom: 6px;
    }

    .nav .active {
      background: #171d2d;
      color: white;
    }

    main {
      flex: 1;
      max-width: 1000px;
      margin: auto;
      padding: 55px 35px;
    }

    .hero {
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(34px, 6vw, 58px);
      margin: 0 0 12px;
      letter-spacing: -2px;
    }

    .hero p {
      color: #aab3c8;
      font-size: 17px;
      max-width: 680px;
      line-height: 1.6;
    }

    .card {
      background: #101625;
      border: 1px solid #252d42;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 15px 45px rgba(0,0,0,.25);
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 12px;
    }

    textarea {
      width: 100%;
      min-height: 155px;
      resize: vertical;
      border: 1px solid #303951;
      border-radius: 12px;
      padding: 16px;
      background: #090d18;
      color: white;
      font: inherit;
      outline: none;
    }

    textarea:focus {
      border-color: #6f7cff;
    }

    .examples {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .example {
      background: #171d2d;
      border: 1px solid #2b344b;
      color: #cbd2e5;
      padding: 8px 11px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
    }

    .forge {
      margin-top: 18px;
      border: 0;
      border-radius: 11px;
      padding: 14px 22px;
      background: #ffffff;
      color: #080b14;
      font-weight: 800;
      cursor: pointer;
      font-size: 15px;
    }

    #result {
      display: none;
      margin-top: 25px;
    }

    .result-title {
      font-size: 23px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .section {
      background: #0b101d;
      border: 1px solid #252d42;
      border-radius: 13px;
      padding: 18px;
      margin-top: 12px;
    }

    .section h3 {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .section p,
    .section li {
      color: #b8c1d5;
      line-height: 1.6;
    }

    .reset {
      margin-top: 18px;
      background: transparent;
      border: 1px solid #303951;
      color: #cbd2e5;
      padding: 10px 15px;
      border-radius: 9px;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      aside {
        display: none;
      }

      main {
        padding: 35px 18px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <aside>
    <div class="logo">ForgeFlow AI</div>
    <div class="tagline">
      Have a problem?<br>
      Forge a solution.
    </div>

    <div class="nav">
      <div class="active">Forge</div>
      <div>Action Plans</div>
      <div>Impact</div>
    </div>
  </aside>

  <main>

    <section class="hero">
      <h1>Forge a solution.</h1>
      <p>
        Turn a real-world problem into a practical action plan,
        impact goals, and a reality check.
      </p>
    </section>

    <section class="card">

      <label for="problem">What's the problem?</label>

      <textarea
        id="problem"
        placeholder="Describe the problem you're facing..."
      ></textarea>

      <div class="examples">

        <button class="example"
          onclick="example('I struggle to manage my study time.')">
          Study time
        </button>

        <button class="example"
          onclick="example('Our community has too much plastic waste.')">
          Plastic waste
        </button>

        <button class="example"
          onclick="example('I want to learn programming but don’t know where to start.')">
          Learn coding
        </button>

      </div>

      <button class="forge" onclick="forge()">
        Forge Solution →
      </button>

      <div id="result">

        <div class="result-title">
          Your forged action plan
        </div>

        <div class="section">
          <h3>Analysis</h3>
          <p id="analysis"></p>
        </div>

        <div class="section">
          <h3>Action Plan</h3>
          <ol id="actions"></ol>
        </div>

        <div class="section">
          <h3>Impact Goals</h3>
          <p id="impact"></p>
        </div>

        <div class="section">
          <h3>Reality Check</h3>
          <p id="reality"></p>
        </div>

        <button class="reset" onclick="resetForge()">
          Forge another solution
        </button>

      </div>

    </section>

  </main>

</div>

<script>

function example(text) {
  document.getElementById("problem").value = text;
}

function forge() {

  const problem = document.getElementById("problem").value.trim();

  if (!problem) {
    alert("Describe a problem first.");
    return;
  }

  document.getElementById("analysis").textContent =
    "The main challenge is turning this problem into a sequence of realistic actions. The first priority is to define a clear outcome and identify the smallest useful step.";

  document.getElementById("actions").innerHTML = `
    <li>Define the desired outcome and what success should look like.</li>
    <li>Break the problem into smaller, manageable tasks.</li>
    <li>Start with the highest-impact action that can be completed now.</li>
    <li>Review the result and adjust the plan based on what you learn.</li>
    <li>Continue measuring progress toward the goal.</li>
  `;

  document.getElementById("impact").textContent =
    "Create measurable progress, reduce the immediate obstacle, and establish a repeatable path toward the desired outcome.";

  document.getElementById("reality").textContent =
    "The plan depends on available time, resources, and follow-through. Start small, measure what happens, and adapt rather than trying to solve everything at once.";

  document.getElementById("result").style.display = "block";

  document.getElementById("result").scrollIntoView({
    behavior: "smooth"
  });
}

function resetForge() {
  document.getElementById("problem").value = "";
  document.getElementById("result").style.display = "none";
}

</script>

</body>
</html>
